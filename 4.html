<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практичне завдання №4</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .main {
      height: 100vh;
    }

    .block {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border: 1px solid #cccccc;
    }

    @media (max-width: 519px) {
      .block1 {
        flex: 0 0 100%;
        max-width: 100%;
        background-color: #4f81bd;
        color: #ffffff;
      }

      .block2 {
        flex: 0 0 100%;
        max-width: 100%;
        background-color: #ffc000;
        color: #ffffff;
      }

      .block3 {
        flex: 0 0 100%;
        max-width: 100%;
        background-color: #c00000;
        color: #ffffff;
      }
    }

    @media (min-width: 520px) {
      .block1 {
        flex: 0 0 50%;
        max-width: 50%;
        background-color: #4f81bd;
        color: #ffffff;
      }

      .block2 {
        flex: 0 0 25%;
        max-width: 25%;
        background-color: #ffc000;
        color: #ffffff;
      }

      .block3 {
        flex: 0 0 25%;
        max-width: 25%;
        background-color: #c00000;
        color: #ffffff;
      }
    }
  </style>
</head>
<body>
  <div class="container-fluid p-0">
    <div class="row no-gutters main">
      <div class="col-12 block block1">#1</div>
      <div class="col-12 block block2">#2</div>
      <div class="col-12 block block3">#3</div>
    </div>
  </div>
</body>
</html>
